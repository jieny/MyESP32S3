board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
upload_speed = 921600
monitor_speed = 115200
lib_deps = 
	tzapu/WiFiManager@^2.0.17
	amcewen/HttpClient@^2.2.0
lib_extra_dirs =
	/Users/jieny/.platformio/packages/framework-arduinoespressif32/libraries